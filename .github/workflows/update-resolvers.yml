name: Update resolvers

on:
  # Every Monday at 04:47 UTC
  schedule:
    - cron: "47 4 * * 1"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never run two updates at once, they would push to the same branch
concurrency:
  group: "update-resolvers"
  cancel-in-progress: false

jobs:
  update-resolvers:
    runs-on: ubuntu-latest
    # The script needs curl with HTTP/3 support, which Debian has and Ubuntu does not.
    # libatomic1 is needed by Node.js, but not included in the image.
    container: debian:trixie
    steps:
      - name: Install curl, git and libatomic1
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git libatomic1
      - name: Checkout
        uses: actions/checkout@v4
      # The container runs as root, but the workspace belongs to the runner user
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test resolvers
        run: pnpm run update-resolvers
      # The date of the test changes every month, only open a pull request if a result changed
      - name: Discard date-only changes
        run: |
          if git diff --quiet -I '^Public resolvers tested in ' -- README.md; then
            git checkout -- README.md
          fi
      # Opens a pull request if README.md changed, updates the open one otherwise.
      # Does nothing when the results are unchanged.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-resolvers
          delete-branch: true
          add-paths: README.md
          commit-message: "docs: update tested DNS over HTTPS resolvers"
          title: "docs: update tested DNS over HTTPS resolvers"
          body: |
            The support of a public DNS over HTTPS resolver changed.
            Generated by `pnpm run update-resolvers`, see the job log for details per resolver.
