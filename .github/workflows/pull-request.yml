name: Pull request checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Cancel superseded runs of the same pull request
concurrency:
  group: "pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  build-example:
    defaults:
      run:
        shell: bash
        working-directory: ./example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the whole workspace, including the example
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build
        run: |
          pnpm run download-tlds
          pnpm run build
        working-directory: .
      - name: Build
        run: pnpm run build
